
name: "Java: Java CI/CD pipiline"
on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:
jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 24
              uses: actions/setup-java@v4
              with:
                    distribution: 'temurin'
                    java-version: '24'
            - name: compile java program
              run: javac new.java
